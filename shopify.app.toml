# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f90051b6e905ff35d1920efa4d6a5e1a"
name = "staging-kas-subscription"
application_url = "https://staging-subscription.kaswebtechsolutions.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "https://subscription.kaswebtechsolutions.com/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  topics = [
  "subscription_billing_attempts/failure",
  "subscription_contracts/create",
  "subscription_contracts/update",
  "subscription_billing_attempts/success"
]

  [[webhooks.subscriptions]]
  uri = "https://subscription.kaswebtechsolutions.com/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://subscription.kaswebtechsolutions.com/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "customer_read_customers,customer_read_own_subscription_contracts,customer_write_own_subscription_contracts,read_cart_transforms,read_customer_payment_methods,read_customers,read_draft_orders,read_files,read_inventory,read_orders,read_own_subscription_contracts,read_products,read_publications,read_purchase_options,write_cart_transforms,write_customers,write_draft_orders,write_files,write_own_subscription_contracts,write_products,write_publications,write_purchase_options"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://staging-subscription.kaswebtechsolutions.com/auth/callback"
]

[app_proxy]
url = "https://staging-subscription.kaswebtechsolutions.com"
subpath = "subscriptions"
prefix = "apps"
