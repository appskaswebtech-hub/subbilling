# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "72e2c177c84e8fb0b9f4ee027fa0cafa"
name = "Smart Subscriptions"
application_url = "https://subscription.kaswebtechsolutions.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [
  "subscription_contracts/update",
  "subscription_billing_attempts/success",
  "subscription_billing_attempts/failure",
  "subscription_contracts/create"
]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "customer_read_customers,customer_read_own_subscription_contracts,read_all_orders,read_customer_payment_methods,read_customers,read_orders,read_own_subscription_contracts,read_products,write_customers,write_own_subscription_contracts,write_products,write_purchase_options"

[auth]
redirect_urls = [ "https://subscription.kaswebtechsolutions.com/api/auth" ]

[app_proxy]
# Relative on purpose. The proxy REPLACES `/{prefix}/{subpath}` with this URL
# rather than appending to it, so a bare host would forward
# /apps/subscriptions/billing-history to /billing-history and 404 — the routes
# live at /apps/subscriptions/*. A leading-slash value is resolved by the CLI
# against the current `application_url`, so it follows the dev tunnel and
# production without a constant that can go stale.
url = "/apps/subscriptions"
subpath = "subscriptions"
prefix = "apps"
