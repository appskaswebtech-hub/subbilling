query CartInput {
  # Shop currency → the shopper's currency. A fixed bundle price is stored in
  # the shop currency; cart prices are in the shopper's.
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      # Set by the storefront bundle block on every line of a bundle it adds.
      bundleId: attribute(key: "_kas_bundle") {
        value
      }
      # Unit price, for the exact fixed bundle price.
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          # Bundles match by product: the shopper may pick any variant.
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    # Written by the app (app/lib/bundles.server.ts) whenever a one-time
    # bundle is saved or deleted.
    metafield(namespace: "$app", key: "bundle-config") {
      jsonValue
    }
  }
}
